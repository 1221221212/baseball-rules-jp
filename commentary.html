<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンメンタール野球規則</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="msg">読み込み中…</div>
<button id="burger" aria-label="目次">☰</button>
<div id="scrim"></div>
<div id="app" hidden>
  <aside id="side">
    <div id="brand">
      <h1>コンメンタール</h1>
      <select id="yearsel" title="どの年度の条文に合わせて表示するか"></select>
    </div>
    <div id="modes">
      <button data-go-rules>条文へ</button>
      <button class="on">解説</button>
    </div>
    <div id="searchwrap">
      <input id="q" type="search" placeholder="検索" autocomplete="off" spellcheck="false">
      <button id="qclear" aria-label="クリア">✕</button>
    </div>
    <nav id="nav"></nav>
    <div id="tools">
      <button id="bnew" class="pri">＋ 解説を書く</button>
      <div class="sub">
        <button id="btheme">◐ 自動</button>
        <button id="bexport">↓ 書出</button>
      </div>
    </div>
  </aside>
  <main id="main"><div id="doc"></div></main>
</div>
<script src="diff.js"></script>
<script src="refs.js"></script>
<script src="commentary.js"></script>
</body>
</html>
