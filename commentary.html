<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公認野球規則</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="msg">読み込み中…</div>
<button id="burger" aria-label="目次">☰</button>
<div id="scrim"></div>
<div id="app" hidden>
  <aside id="side">
    <div id="brand">
      <h1>公認野球規則</h1>
      <select id="yearsel" title="どの年度の条文に合わせて表示するか"></select>
    </div>
    <div id="modes">
      <button data-go-rules>規則</button>
      <button class="on">解説</button>
    </div>
    <div id="searchwrap">
      <input id="q" type="search" placeholder="検索" autocomplete="off" spellcheck="false">
      <button id="qclear" aria-label="クリア">✕</button>
    </div>
    <nav id="nav"></nav>
    <div id="tools">
      <button id="bnew">＋ 解説を書く</button>
    </div>
  </aside>
  <main id="main">
    <div id="legend">
      <span><span class="src src-def">定義</span>規則書に定義がある</span>
      <span><span class="src src-drv">導出</span>他の条文から導ける</span>
      <span><span class="src src-own">私見</span>規則に手がかりがない</span>
      <span>印のないものは条文を読めばそのまま分かる</span>
    </div>
    <div id="doc"></div>
  </main>
</div>
<script src="diff.js"></script>
<script src="refs.js"></script>
<script src="commentary.js"></script>
</body>
</html>
