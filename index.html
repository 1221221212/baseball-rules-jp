<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公認野球規則</title>
<style>
:root{
  --bg:#fafbfa; --panel:#fff; --line:#dde3df; --line2:#edf1ee;
  --fg:#1a1d1b; --fg2:#575e59; --fg3:#858c87;
  --accent:#1e5540; --accent-bg:#ecf3ef;
  --mark:#cfe8d8;
  --add:#1f7a4d; --add-bg:#e9f6ef;
  --del:#a8332a; --del-bg:#fcefed;
  --chg:#9a6b1f; --chg-bg:#fbf4e6;
  --ren:#2f6f9f; --ren-bg:#eef5fb;
  --rep:#6b4a9a; --rep-bg:#f3effa;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -14px rgba(0,0,0,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141715; --panel:#1b1f1c; --line:#333a35; --line2:#232926;
  --fg:#e6e9e7; --fg2:#a2a9a4; --fg3:#79807b;
  --accent:#8ecfae; --accent-bg:#16271f;
  --mark:#1f4a36;
  --add:#6cc394; --add-bg:#16271e;
  --del:#e79289; --del-bg:#2e1d1b;
  --chg:#dcb069; --chg-bg:#2b2418;
  --ren:#8fbde4; --ren-bg:#1b2530;
  --rep:#b79ae0; --rep-bg:#241d30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme=dark]{
  --bg:#141715; --panel:#1b1f1c; --line:#333a35; --line2:#232926;
  --fg:#e6e9e7; --fg2:#a2a9a4; --fg3:#79807b;
  --accent:#8ecfae; --accent-bg:#16271f;
  --mark:#1f4a36;
  --add:#6cc394; --add-bg:#16271e;
  --del:#e79289; --del-bg:#2e1d1b;
  --chg:#dcb069; --chg-bg:#2b2418;
  --ren:#8fbde4; --ren-bg:#1b2530;
  --rep:#b79ae0; --rep-bg:#241d30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}

#app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100dvh}
#side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#main{overflow-y:auto;min-width:0}

#brand{padding:13px 16px 11px;border-bottom:1px solid var(--line2);display:flex;
  align-items:center;gap:.55em;flex-wrap:wrap}
#brand h1{margin:0;font-size:15px;letter-spacing:.02em}
#yearsel{margin-left:auto;padding:3px 6px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);font-size:13px;font-variant-numeric:tabular-nums}
#modes{display:flex;padding:8px 12px 0;gap:4px;border-bottom:1px solid var(--line2)}
#modes button{flex:1;padding:6px 4px 8px;border:0;background:none;color:var(--fg3);
  cursor:pointer;font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
#modes button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
#modes button:hover{color:var(--fg2)}
#searchwrap{padding:10px 12px;border-bottom:1px solid var(--line2);position:relative}
#q{width:100%;padding:8px 28px 8px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
/* ブラウザ標準のクリアボタン（丸い✕アイコン）を消す。自前の✕と二重になるため */
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
#qclear{position:absolute;right:19px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--fg3);cursor:pointer;display:none;padding:4px;line-height:1}
#nav{overflow-y:auto;flex:1;padding:6px 0 40px;min-height:0}
.navch{padding:10px 14px 4px;font-size:11px;font-weight:700;color:var(--fg3);letter-spacing:.09em}
.navit{display:flex;align-items:baseline;gap:.5em;width:100%;text-align:left;
  padding:5px 12px 5px 18px;border:0;background:none;cursor:pointer;color:var(--fg2);
  font-size:13px;border-left:2px solid transparent}
.navit:hover{background:var(--accent-bg);color:var(--fg)}
.navit.on{color:var(--fg);border-left-color:var(--fg2);background:var(--line2);font-weight:700}
.navit .n{color:var(--fg3);font-variant-numeric:tabular-nums;flex:none;min-width:2.6em}
.navit.on .n{color:var(--fg2)}
.navit .t{flex:1;min-width:0}
.badge{flex:none;font-size:10px;padding:0 5px;border-radius:9px;line-height:16px;font-weight:700}
.b-chg{background:var(--accent-bg);color:var(--accent)}
#tools{display:grid;gap:6px;padding:9px 12px;border-top:1px solid var(--line2);background:var(--panel)}
#tools .sub{display:flex;gap:6px}
#tools button{flex:1;font-size:11.5px;padding:6px 4px;border:1px solid var(--line);
  background:var(--bg);border-radius:6px;cursor:pointer;color:var(--fg2);white-space:nowrap}
#tools button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
#tools .pri{font-size:12.5px;padding:8px 4px;color:var(--fg);font-weight:700}
#tools .pri:hover{border-color:var(--accent);color:var(--accent)}

#doc,#results,#diffview{max-width:920px;margin:0 auto;padding:32px 40px 45vh}
.chaptag{color:var(--fg3);font-size:12px;letter-spacing:.09em;margin-bottom:6px}
h1.chap{font-size:15px;font-weight:700;color:var(--fg3);letter-spacing:.1em;
  margin:56px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line);
  display:flex;gap:.7em;align-items:baseline;scroll-margin-top:12px}
h1.chap:first-child{margin-top:0}
h1.chap .num{font-variant-numeric:tabular-nums}
.sect{scroll-margin-top:10px;padding-bottom:8px}
.sect+.sect{margin-top:26px}
h2.rule{font-size:18px;margin:20px 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line2);
  display:flex;align-items:baseline;gap:.55em;flex-wrap:wrap}
h2.rule .num{font-variant-numeric:tabular-nums}
.node{scroll-margin-top:76px;border-radius:5px}
.node.item{margin-top:19px}
.node.clause{margin-top:10px}
.node.subclause{margin-top:7px}
.node>.head{display:flex;gap:.5em;align-items:baseline}
.lbl{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.node.item>.head .lbl{font-size:15px}
.ttl{font-weight:700}
.body{line-height:1.95;text-align:justify;min-width:0;flex:1}
.body p{margin:0 0 .4em}
.body p:last-child{margin-bottom:0}
.kids{padding-left:1.8em}
.body.cont{margin-top:.55em}
.node.flash>.head,.node.flash>.nh{background:var(--mark);box-shadow:0 0 0 5px var(--mark);border-radius:3px}
.xref{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

.note{margin:8px 0;border-left:3px solid var(--fg3);background:var(--line2);
  border-radius:0 7px 7px 0;padding:8px 13px;font-size:13.5px;line-height:1.85}
.note .nh{font-weight:700;font-size:12px;margin-bottom:2px;display:flex;gap:.6em;
  align-items:center;flex-wrap:wrap}
.note .scope{font-weight:400;color:var(--fg3);font-size:11px}
/* 注記の中に注記が入るので、背景は不透明にする（透過だと親の色が透けて混ざる） */
.k-注{--nc:#2f6f9f} .k-原注{--nc:#9a6b1f} .k-ペナルティ{--nc:#a8332a}
.k-規則説明{--nc:#6b4a9a} .k-付記{--nc:#1f7a70} .k-例外{--nc:#a35a1a}
.k-軟式注{--nc:#3d7a3d} .k-問{--nc:#5f594f} .k-答{--nc:#5f594f}
.k-例題{--nc:#5f594f} .k-解答{--nc:#5f594f}
.note[class*="k-"]{border-color:var(--nc);
  background:color-mix(in srgb, var(--nc) 8%, var(--bg))}
.note[class*="k-"] .nh{color:var(--nc)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .note[class*="k-"]{
  background:color-mix(in srgb, var(--nc) 16%, var(--bg))}
  :root:not([data-theme=light]) .note[class*="k-"] .nh{filter:brightness(1.55)}}
:root[data-theme=dark] .note[class*="k-"]{
  background:color-mix(in srgb, var(--nc) 16%, var(--bg))}
:root[data-theme=dark] .note[class*="k-"] .nh{filter:brightness(1.55)}

/* 桁を揃えるためだけの表。罫線も背景も付けず、本文の一部に見えるようにする */
.tw{overflow-x:auto;margin:.5em 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{border:0;padding:.1em 1.4em .1em 0;text-align:left;font-weight:400}
th{color:inherit;background:none}
tr>*:first-child{padding-right:1.1em}

.term{margin:0 0 18px;padding-bottom:15px;border-bottom:1px solid var(--line2)}
.term h3{margin:0 0 4px;font-size:16px;display:flex;gap:.55em;align-items:baseline}
.term h3 .n{color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}

#results .cnt,#diffview .cnt{color:var(--fg3);font-size:12.5px;margin-bottom:14px}
.hit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);
  background:none;cursor:pointer;padding:11px 10px;border-radius:6px}
.hit:hover{background:var(--accent-bg)}
.hit .bc{font-size:11.5px;color:var(--fg3);margin-bottom:3px}
.hit .sn{font-size:13.5px;line-height:1.75;color:var(--fg2)}

/* 差分（左右2カラム比較） */
#diffview{max-width:1500px}
#diffbar{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:4px}
#diffbar .opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:0 2px 8px}
#diffbar label{display:flex;align-items:center;gap:.4em;font-size:12.5px;color:var(--fg2);cursor:pointer}
#diffbar .stat{margin-left:auto;font-size:11.5px;color:var(--fg3);display:flex;gap:10px;flex-wrap:wrap}
#diffbar .stat b{font-weight:700}
.s-add{color:var(--add)} .s-del{color:var(--del)} .s-chg{color:var(--chg)}
.s-ren{color:var(--ren)} .s-rep{color:var(--rep)}
#diffbar .yrs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);
  border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;background:var(--panel)}
#diffbar .yrs>div{padding:6px 12px}
#diffbar .yrs>div:first-child{border-right:1px solid var(--line)}
#diffbar select{padding:3px 7px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--accent)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);
  border-top:0;background:var(--panel)}
.cols.uni{grid-template-columns:1fr}
#diffbar .yrs.uni{display:flex;align-items:center;gap:4px}
#diffbar .yrs.uni>div{border-right:0;padding:6px 8px}
#diffbar .yrs.uni>div:last-child::before{content:"→";color:var(--fg3);margin-right:6px}
.cell.u del{opacity:.85}
.cell.u{border-bottom:1px solid var(--line2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--fg3);font-size:11.5px;
  padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
.cols:last-child{border-radius:0 0 10px 10px;overflow:hidden}
.row{display:contents}
.cell{padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13.5px;line-height:1.9;
  text-align:justify;min-width:0}
.cell.l{border-right:1px solid var(--line)}
.cell .lb{font-weight:700;margin-right:.45em;font-variant-numeric:tabular-nums}
.cell .tt{font-weight:700}
.cell .kd{font-size:11px;font-weight:700;color:var(--fg3);margin-right:.45em}
.cell .idchip{display:inline-block;font-size:10.5px;font-variant-numeric:tabular-nums;
  color:var(--ren);background:var(--ren-bg);border-radius:9px;padding:0 7px;margin-right:.5em;
  vertical-align:1px}
.cell.empty{background:repeating-linear-gradient(-45deg,transparent,transparent 6px,
  var(--line2) 6px,var(--line2) 7px)}
.r-changed .cell{background:var(--chg-bg)}
.r-added .cell.r{background:var(--add-bg)}
.r-removed .cell.l{background:var(--del-bg)}
.r-renamed .cell{background:var(--ren-bg)}
.cell del{background:var(--del-bg);color:var(--del);text-decoration:line-through;
  text-decoration-thickness:1px;border-radius:2px;padding:0 1px}
.cell ins{background:var(--add-bg);color:var(--add);text-decoration:none;border-radius:2px;
  padding:0 1px;font-weight:600}
.rowtag{grid-column:1/-1;display:flex;gap:.6em;align-items:center;flex-wrap:wrap;
  padding:5px 14px 0;font-size:11px;color:var(--fg3);border-bottom:0}
.st{font-size:10.5px;padding:1px 8px;border-radius:10px;font-weight:700;flex:none}
.st-added{background:var(--add-bg);color:var(--add)}
.st-removed{background:var(--del-bg);color:var(--del)}
.st-changed{background:var(--chg-bg);color:var(--chg)}
.st-renamed,.st-renamed_changed{background:var(--ren-bg);color:var(--ren)}
.st-reparented{background:var(--rep-bg);color:var(--rep)}
.r-reparented .cell{background:var(--rep-bg)}
.ofc{font-size:10.5px;padding:1px 8px;border-radius:10px;background:var(--line2);color:var(--fg3);flex:none}
.cite-l{font-weight:700;color:var(--accent);cursor:pointer;font-variant-numeric:tabular-nums}
.secttl{font-size:19px;font-weight:700;margin:22px 0 9px;display:flex;gap:.55em;align-items:baseline}
.secttl .num{font-variant-numeric:tabular-nums}
.secttl .cnt{font-size:11px;font-weight:700;color:var(--chg);background:var(--chg-bg);
  padding:1px 8px;border-radius:10px}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .cell.l{border-right:0;border-bottom:1px dashed var(--line)}
  /* 縦積みになるので、どちらの年かを各セルに出す */
  .cell::before{content:attr(data-y);display:block;font-size:10.5px;font-weight:700;
    color:var(--fg3);letter-spacing:.06em;margin-bottom:3px}
  .cell.empty{min-height:2.4em}
  #diffbar .yrs{display:flex;align-items:center;gap:4px;border-radius:10px}
  #diffbar .yrs>div{padding:6px 8px;border-right:0!important}
  #diffbar .yrs>div:last-child::before{content:"→";color:var(--fg3);margin-right:6px}
  /* 固定表示のバーガーと重ならないよう、先頭行だけ左を空ける */
  #diffbar .opts{gap:8px;padding-left:52px;min-height:38px}
  #diffbar .stat{margin-left:0;width:100%;padding-left:0}
}

/* 注釈 */
.amd{margin:9px 0;border:1px solid var(--accent);background:var(--accent-bg);
  border-radius:8px;padding:9px 13px;font-size:13.5px;line-height:1.8}
.amd .ah{font-weight:700;color:var(--accent);font-size:12px;margin-bottom:3px;
  display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.amd .meta{font-weight:400;color:var(--fg3);font-size:11px}
.amd .acts{margin-top:5px;display:flex;gap:7px}
.amd .acts button{font-size:11px;padding:2px 8px;border:1px solid var(--line);
  background:var(--panel);border-radius:5px;cursor:pointer;color:var(--fg2)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);
  padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh2{padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:700;font-size:14px}
dialog .db{padding:16px 18px;display:grid;gap:11px}
dialog label{display:grid;gap:4px;font-size:12px;color:var(--fg2)}
dialog input,dialog textarea,dialog select{padding:7px 9px;border:1px solid var(--line);
  border-radius:7px;background:var(--bg);outline:none;width:100%;font-family:inherit}
dialog input:focus,dialog textarea:focus,dialog select:focus,#pick:focus-within{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
#yearsel:focus,#diffbar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
#pick{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:5px;
  transition:box-shadow .12s}
#pick input{border:0;background:none;padding:4px 5px}
#chips{display:flex;flex-wrap:wrap;gap:5px}
#chips:not(:empty){margin-bottom:4px}
.chip2{display:inline-flex;align-items:center;gap:.4em;font-size:11.5px;background:var(--accent-bg);
  border-radius:6px;padding:3px 5px 3px 8px;color:var(--fg2);max-width:100%}
.chip2 b{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.chip2 button{border:0;background:none;color:var(--fg3);cursor:pointer;padding:0 2px;font-size:12px}
.chip2 button:hover{color:var(--del)}
#picklist{max-height:190px;overflow-y:auto;border-top:1px solid var(--line2);margin-top:4px}
#picklist button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:6px 7px;border-radius:5px;font-size:12.5px;color:var(--fg2)}
#picklist button:hover,#picklist button.sel{background:var(--accent-bg);color:var(--fg)}
#picklist .id{font-weight:700;color:var(--fg);margin-right:.6em;font-variant-numeric:tabular-nums}
dialog textarea{min-height:78px;resize:vertical;line-height:1.7}
dialog .frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
dialog .df{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
dialog .df button{padding:7px 15px;border:1px solid var(--line);background:var(--bg);
  border-radius:7px;cursor:pointer}
dialog .df .pri{background:var(--accent);color:#fff;border-color:var(--accent)}

#msg{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;
  text-align:center;padding:24px;line-height:1.9}
#msg code{background:var(--line2);padding:2px 7px;border-radius:5px;font-size:13px}
#burger{display:none}
#scrim{display:none}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:290px;z-index:20;transform:translateX(-100%);
    transition:transform .18s;box-shadow:var(--shadow)}
  body.nav #side{transform:none}
  #burger{display:block;position:fixed;top:9px;left:9px;z-index:22;width:38px;height:38px;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;
    font-size:15px;line-height:1}
  /* バーガー(38px)を上下9pxずつの余白で収めるため、見出し帯を56pxにして中央に揃える。
     開いている間はバーガーが重なるので、その分だけ左も空ける */
  #brand{min-height:56px;padding-top:0;padding-bottom:0}
  body.nav #brand{padding-left:56px}
  #scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.38);
    opacity:0;pointer-events:none;transition:opacity .18s}
  body.nav #scrim{opacity:1;pointer-events:auto}
  #doc,#results,#diffview{padding:58px 18px 45vh}
  .kids{padding-left:1em}
}
@media print{
  #side,#burger{display:none}#app{display:block;height:auto}
  #doc{max-width:none;padding:0}body{font-size:10.5pt}
}
</style>
</head>
<body>
<div id="msg">読み込み中…</div>
<button id="burger" aria-label="目次">☰</button>
<div id="scrim"></div>
<div id="app" hidden>
  <aside id="side">
    <div id="brand">
      <h1>公認野球規則</h1>
      <select id="yearsel" title="年度"></select>
    </div>
    <div id="modes">
      <button data-mode="read" class="on">条文</button>
      <button data-mode="diff">改正差分</button>
    </div>
    <div id="searchwrap">
      <input id="q" type="search" placeholder="検索" autocomplete="off" spellcheck="false">
      <button id="qclear" aria-label="クリア">✕</button>
    </div>
    <nav id="nav"></nav>
    <div id="tools">
      <button id="bnew" class="pri">＋ 注釈を作成</button>
      <div class="sub">
        <button id="btheme">◐ 自動</button>
        <button id="bexport">↓ 書出</button>
        <button id="bimport">↑ 読込</button>
      </div>
    </div>
  </aside>
  <main id="main">
    <div id="doc"></div>
    <div id="results" hidden></div>
    <div id="diffview" hidden></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog">
  <div class="dh2" id="dlgtitle">注釈を追加</div>
  <div class="db">
    <label>対象の条文
      <div id="pick">
        <div id="chips"></div>
        <input id="f_pick" placeholder="条番号や語句で検索して追加（5.02、ボーク など）"
               autocomplete="off" spellcheck="false">
        <div id="picklist" hidden></div>
      </div>
    </label>
    <div class="frow">
      <label>種別<select id="f_type">
        <option value="amendment">改正</option>
        <option value="interpretation">解釈</option>
        <option value="case">事例</option>
        <option value="memo">メモ</option>
      </select></label>
      <label>適用年<input id="f_effective" placeholder="2027"></label>
    </div>
    <label>見出し<input id="f_title" placeholder="内野手の守備位置の制限"></label>
    <label>本文<textarea id="f_body"></textarea></label>
    <label>出典<input id="f_source" placeholder="2027年規則改正 / 審判員研修 など"></label>
  </div>
  <div class="df">
    <button value="cancel">キャンセル</button>
    <button value="save" class="pri">保存</button>
  </div>
</form></dialog>
<input id="fileinput" type="file" accept="application/json" hidden>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== 状態 ===== */
const S = {
  manifest: null,
  year: null,
  cache: {},          // year -> {nodes, byId, byCite, kids, sections, sectionOf, chapters}
  diffs: {},          // "2025-2026" -> data
  changedIn: {},      // year -> Set(id)  その年に改正のあった条項
  mode: "read",
  section: null,
  onlyChanged: true,      // 差分モードは既定で改正箇所のみ
  uni: null,              // 差分の表示。null=画面幅で自動、true=インライン、false=並べて
};
const isNarrow = () => window.innerWidth < 820;
const WHOLE = new Set(["y", "s"]);   // 章まるごと表示する（用語の定義・一般指示）

/* ===== 読み込み ===== */
async function getJSON(path) {
  const r = await fetch(path, {cache: "no-cache"});
  if (!r.ok) throw new Error(path + " が読めません (" + r.status + ")");
  return r.json();
}

function indexYear(doc) {
  const nodes = [], kids = new Map(), byId = new Map(), byCite = new Map();
  function walk(n, parent) {
    n.parent = parent;
    nodes.push(n);
    byId.set(n.id, n);
    for (const a of (n.cite_ids || [])) if (!byCite.has(a)) byCite.set(a, n);
    if (!kids.has(parent)) kids.set(parent, []);
    kids.get(parent).push(n);
    for (const c of (n.children || [])) walk(c, n.id);
  }
  for (const ch of doc.chapters) walk(ch, null);

  const chapters = doc.chapters;
  const sections = [];
  for (const c of chapters) {
    if (WHOLE.has(c.id)) sections.push(c);
    else for (const s of (kids.get(c.id) || [])) sections.push(s);
  }
  const sectionOf = new Map();
  const mark = (n, sec) => { sectionOf.set(n.id, sec); for (const k of (kids.get(n.id) || [])) mark(k, sec); };
  for (const s of sections) mark(s, s.id);
  for (const c of chapters) if (!sectionOf.has(c.id)) sectionOf.set(c.id, c.id);
  return {doc, nodes, byId, byCite, kids, chapters, sections, sectionOf};
}

async function loadYear(y) {
  if (S.cache[y]) return S.cache[y];
  const info = S.manifest.years.find(x => x.year === y);
  S.cache[y] = indexYear(await getJSON(info.path));
  return S.cache[y];
}

/* --- 差分計算（ブラウザ側） ------------------------------------------------
   年度がN個あると組み合わせは N(N-1)/2 通り。事前計算はスケールしないので、
   選ばれた2年をその場で突き合わせる。1,300ノードで数msで終わる。
   突き合わせは3段階。IDだけで見ると注記の採番繰り上げ（【注3】削除→【注4】が繰り上がる）
   を別物と誤判定するため、同じ親の中で本文が一致するものを最優先で結ぶ。 */
const EDIT_MARKS = /《[新改削訂]》/g;
const canon = n => ((n.title || "") + "\n" + (n.text || []).join("\n"))
  .replace(EDIT_MARKS, "").replace(/[\s\u3000]+/g, "");

function longestCommon(a, b) {
  let best = [0, 0, 0];
  let prev = new Int32Array(b.length + 1), cur = new Int32Array(b.length + 1);
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : 0;
      if (cur[j] > best[2]) best = [i - cur[j], j - cur[j], cur[j]];
    }
    [prev, cur] = [cur, prev];
    cur.fill(0);
  }
  return best;
}

function inlineOps(a, b) {
  const out = [];
  (function rec(a, b, depth) {
    if (!a.length && !b.length) return;
    if (!a.length) { out.push(["insert", b]); return; }
    if (!b.length) { out.push(["delete", a]); return; }
    let s = 0;
    while (s < a.length && s < b.length && a[s] === b[s]) s++;
    let e = 0;
    while (e < a.length - s && e < b.length - s && a[a.length - 1 - e] === b[b.length - 1 - e]) e++;
    if (s) out.push(["equal", a.slice(0, s)]);
    const ma = a.slice(s, a.length - e), mb = b.slice(s, b.length - e);
    if (ma.length && mb.length) {
      // 中間が長すぎるときは分割をあきらめて丸ごと置換（計算量を抑える）
      if (depth > 6 || ma.length * mb.length > 250000) {
        out.push(["delete", ma], ["insert", mb]);
      } else {
        const [i, j, n] = longestCommon(ma, mb);
        if (n < 3) out.push(["delete", ma], ["insert", mb]);
        else {
          rec(ma.slice(0, i), mb.slice(0, j), depth + 1);
          out.push(["equal", ma.slice(i, i + n)]);
          rec(ma.slice(i + n), mb.slice(j + n), depth + 1);
        }
      }
    } else if (ma.length) out.push(["delete", ma]);
    else if (mb.length) out.push(["insert", mb]);
    if (e) out.push(["equal", a.slice(a.length - e)]);
  })(a, b, 0);
  // 連続する同種を畳む
  const m = [];
  for (const [t, v] of out) {
    if (m.length && m[m.length - 1][0] === t) m[m.length - 1][1] += v;
    else m.push([t, v]);
  }
  return m.filter(x => x[1].length);
}

function similarity(a, b) {
  if (!a.length && !b.length) return 1;
  let n = 0;
  const ops = inlineOps(a.slice(0, 400), b.slice(0, 400));
  for (const [t, v] of ops) if (t === "equal") n += v.length;
  return (2 * n) / (Math.min(a.length, 400) + Math.min(b.length, 400) || 1);
}

const bodyOf = n => ((n.title || "") + "\n" + (n.text || []).join("\n")).trim();

async function computeDiff(fromY, toY) {
  const key = fromY + "-" + toY;
  if (S.diffs[key]) return S.diffs[key];
  const [YA, YB] = [await loadYear(fromY), await loadYear(toY)];
  const A = YA.byId, B = YB.byId;

  const group = Yc => {
    const g = new Map();
    for (const n of Yc.nodes) {
      const p = n.parent;
      if (!g.has(p)) g.set(p, []);
      g.get(p).push(n);
    }
    return g;
  };
  const ga = group(YA), gb = group(YB);
  const pairs = new Map(), doneA = new Set(), doneB = new Set();

  for (const [p, la] of ga) {                       // 1. 同じ親・同じlevel・本文一致
    const rest = (gb.get(p) || []).slice();
    for (const na of la) {
      const ca = canon(na);
      const i = rest.findIndex(nb => nb.level === na.level && canon(nb) === ca);
      if (i >= 0) { pairs.set(na.id, rest[i].id); doneA.add(na.id); doneB.add(rest[i].id); rest.splice(i, 1); }
    }
  }
  for (const n of YA.nodes) {                       // 2. ID一致
    if (!doneA.has(n.id) && B.has(n.id) && !doneB.has(n.id)) {
      pairs.set(n.id, n.id); doneA.add(n.id); doneB.add(n.id);
    }
  }
  const leftA = YA.nodes.filter(n => !doneA.has(n.id));
  const leftB = YB.nodes.filter(n => !doneB.has(n.id));
  for (const na of leftA) {                         // 3. 類似度（採番替え）
    let best = null, bestR = 0.60;
    for (const nb of leftB) {
      if (doneB.has(nb.id) || nb.level !== na.level || nb.parent !== na.parent) continue;
      const r = similarity(canon(na), canon(nb));
      if (r > bestR) { best = nb; bestR = r; }
    }
    if (best) { pairs.set(na.id, best.id); doneA.add(na.id); doneB.add(best.id); }
  }

  // 4. 親をまたいで本文が一致するもの＝係り先が変わった注記など
  const restA = YA.nodes.filter(n => !doneA.has(n.id));
  const restB = YB.nodes.filter(n => !doneB.has(n.id));
  const byText = new Map();
  for (const nb of restB) {
    const k = nb.level + "\u0000" + canon(nb);
    if (!byText.has(k)) byText.set(k, []);
    byText.get(k).push(nb);
  }
  for (const na of restA) {
    const bucket = byText.get(na.level + "\u0000" + canon(na));
    if (!bucket) continue;
    const nb = bucket.find(x => !doneB.has(x.id));
    if (nb) { pairs.set(na.id, nb.id); doneA.add(na.id); doneB.add(nb.id); }
  }

  // 係り先が変わったか。親自身が採番替えされている場合があるので、対応付け後に突き合わせる
  const reparented = (ka, kb) => {
    const pa = A.get(ka).parent, pb = B.get(kb).parent;
    if (!pa && !pb) return null;
    const mapped = pa ? (pairs.get(pa) || pa) : null;
    return mapped === pb ? null : {from: pa, to: pb};
  };

  const entries = [];
  for (const [ka, kb] of pairs) {
    const na = A.get(ka), nb = B.get(kb);
    const same = canon(na) === canon(nb);
    const rep = reparented(ka, kb);
    if (same && !rep && ka === kb) continue;
    const e = {id: kb};
    if (ka !== kb) e.old_id = ka;
    e.status = rep ? (same ? "reparented" : "changed")
      : ka === kb ? "changed"
      : same ? "renamed" : "renamed_changed";
    if (rep) e.reparent = rep;
    entries.push(e);
  }
  for (const n of YA.nodes) if (!doneA.has(n.id)) entries.push({id: n.id, status: "removed"});
  for (const n of YB.nodes) if (!doneB.has(n.id)) entries.push({id: n.id, status: "added"});

  for (const e of entries) {
    const src = A.get(e.old_id || e.id), dst = B.get(e.id);
    const ref = dst || src;
    e.cite = ref.cite || ref.id;
    e.level = ref.level;
    e.before = src ? bodyOf(src) : "";
    e.after = dst ? bodyOf(dst) : "";
    if (e.status === "changed" || e.status === "renamed_changed") e.ops = inlineOps(e.before, e.after);
  }

  const summary = {added: 0, changed: 0, renamed: 0, renamed_changed: 0,
                   reparented: 0, removed: 0};
  for (const e of entries) summary[e.status]++;

  const d = {from: fromY, to: toY, summary, entries,
             pairs: [...pairs]};   // [旧ID, 新ID] の全対応。並べ替えの土台になる
  S.diffs[key] = d;
  return d;
}

const Y = () => S.cache[S.year];

/* ===== 注釈 ===== */
const LS = "obr.annotations";
let fileAnn = [], localAnn = [];
try { localAnn = JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { localAnn = []; }
const TYPE_JA = {amendment: "改正", interpretation: "解釈", case: "事例", memo: "メモ"};
const allAnn = () => fileAnn.concat(localAnn);
const annFor = id => allAnn().filter(a => (a.target || []).includes(id));
const saveLocal = () => localStorage.setItem(LS, JSON.stringify(localAnn));

/* ===== 描画（条文） ===== */
// 参照の書き方は2通りある: 圧縮形 5.06b3 と 展開形 5.06（b）（3）
const REF_RE = /(?<![0-9.])([0-9]{1,2}\.[0-9]{2})((?:（[0-9a-zA-Z]{1,3}）)+|[a-z][0-9]{0,2})?(?![0-9])/g;

function resolveRef(id) {
  const y = Y();
  if (y.byId.has(id)) return id;
  if (y.byCite.has(id)) return y.byCite.get(id).id;
  // 英字の大小が原文で揺れている（6.01（G）など）
  const m = id.match(/^([0-9]+\.[0-9]{2})(.*)$/);
  if (m) {
    for (const v of [m[2].toLowerCase(), m[2].toUpperCase()]) {
      const c = m[1] + v;
      if (y.byId.has(c)) return c;
      if (y.byCite.has(c)) return y.byCite.get(c).id;
    }
  }
  return null;
}

function linkRefs(h) {
  return h.replace(REF_RE, (whole, rule, rest) => {
    const parts = rest ? (rest.startsWith("（")
      ? [...rest.matchAll(/（([0-9a-zA-Z]{1,3})）/g)].map(x => x[1])
      : [rest]) : [];
    const target = resolveRef(rule + parts.join(""));
    return target ? '<a class="xref" data-go="' + target + '">' + whole + "</a>" : whole;
  });
}

/* tail は本文の最後の段落の中に差し込む。右側に場所を確保すると本文が
   早く折り返し、上に浮かせるとホバー時に文字を覆ってしまうため */
function para(text, tail) {
  const arr = (Array.isArray(text) ? text : (text ? [text] : [])).filter(Boolean);
  if (!arr.length) return tail ? "<p>" + tail + "</p>" : "";
  return arr.map((p, i) => "<p>" + linkRefs(esc(p)) +
    (tail && i === arr.length - 1 ? tail : "") + "</p>").join("");
}
const noteCls = k => "k-" + String(k || "").replace(/[0-9A-Z]+$/, "");

function annHTML(id) {
  const list = annFor(id);
  if (!list.length) return "";
  return list.map(a => {
    const meta = [TYPE_JA[a.type] || a.type, a.effective ? a.effective + "年" : "", a.source || ""]
      .filter(Boolean).join(" ・ ");
    const mine = localAnn.includes(a);
    const others = (a.target || []).filter(t => t !== id);
    const also = others.length
      ? '<span class="meta">他: ' + others.map(t =>
          '<a class="xref" data-go="' + esc(t) + '">' + esc((Y().byId.get(t) || {}).cite || t) + "</a>"
        ).join("、") + "</span>"
      : "";
    return '<div class="amd"><div class="ah">' + esc(a.title || "（無題）") +
      '<span class="meta">' + esc(meta) + "</span>" + also + "</div>" +
      (a.body ? '<div class="body">' + para(a.body.split("\n")) + "</div>" : "") +
      (mine ? '<div class="acts"><button data-edit="' + esc(a.id) + '">編集</button>' +
              '<button data-del="' + esc(a.id) + '">削除</button></div>' : "") + "</div>";
  }).join("");
}

function renderNode(n) {
  const chg = S.changedIn[S.year] && S.changedIn[S.year].has(n.id) ? " chg" : "";
  if (n.level === "note") {
    return '<div class="note node ' + noteCls(n.kind) + chg + '" id="' + esc(n.id) + '">' +
      '<div class="nh">' + esc(n.label || "") + "</div>" +
      '<div class="body">' + para(headText(n)) + "</div>" + annHTML(n.id) + renderKids(n) + "</div>";
  }
  if (n.level === "term") {
    return '<div class="term node' + chg + '" id="' + esc(n.id) + '">' +
      '<h3><span class="n">' + esc(n.label || "") + "</span><span>" + esc(n.title || "") + "</span>" +
      "</h3>" +
      '<div class="body">' + para(headText(n)) + "</div>" + annHTML(n.id) + "</div>";
  }
  const head = '<div class="head">' +
    (n.label ? '<span class="lbl">' + esc(n.label) + "</span>" : "") +
    '<div class="body">' +
      (n.title ? '<span class="ttl">' + esc(n.title) + "</span>" + (n.text ? "　" : "") : "") +
      para(headText(n)) + "</div></div>";
  return '<div class="node ' + n.level + chg + '" id="' + esc(n.id) + '">' + head +
    annHTML(n.id) + renderKids(n) + "</div>";
}
// 本文の途中に注記が挟まることがある（3.01のボールを汚す禁止など）。
// 子ノードが持つ pos（親の本文を何段落読んだ時点で現れるか）で本文と交互に並べる。
function headText(n) {
  const ks = Y().kids.get(n.id) || [];
  const txt = n.text || [];
  const lim = ks.length ? (ks[0].pos || 0) : (n.table ? n.table.pos : txt.length);
  return txt.slice(0, lim);
}

function tableHTML(t) {
  if (!t) return "";
  const th = "<tr>" + t.head.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr>";
  const tr = t.rows.map(r => "<tr>" + r.map(c => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("");
  return '<div class="tw"><table>' + th + tr + "</table></div>";
}

// indent=false のときは字下げしない。字下げは「一段上のノードに係る」という意味を
// 持たせているので、条の直下（＝条そのものに係る）では付けない。
/* 狭い画面では左右に並べず、1本の流れに削除と追加を織り込む（unified表示）。
   GitHub なども狭い画面では split を無効にして unified にしている。
   同じ文を2回読まされないぶん、縦に積むより読みやすい。 */
function unifiedCell(a, b, ops, status) {
  const n = b || a;
  const lead = n.level === "note" ? '<span class="kd">' + esc(n.label || "") + "</span>"
    : n.label ? '<span class="lb">' + esc(n.label) + "</span>"
    : (n.level === "rule" || n.level === "chapter") ? '<span class="lb">' + esc(n.id) + "</span>" : "";
  let body;
  if (ops) {
    body = ops.map(([t, v]) => t === "equal" ? esc(v)
      : t === "delete" ? "<del>" + esc(v) + "</del>" : "<ins>" + esc(v) + "</ins>").join("");
  } else if (status === "added") {
    body = "<ins>" + esc(bodyOf(b)) + "</ins>";
  } else if (status === "removed") {
    body = "<del>" + esc(bodyOf(a)) + "</del>";
  } else {
    body = esc(bodyOf(n));
  }
  return '<div class="cell u">' + lead + body + "</div>";
}

function renderKids(n, indent = true) {
  const ks = Y().kids.get(n.id) || [];
  const tb = n.table;
  if (!ks.length) return tb ? tableHTML(tb) : "";
  const txt = n.text || [];
  let ti = ks[0].pos || 0, out = "", buf = [];
  const flush = () => {
    if (!buf.length) return;
    out += indent ? '<div class="kids">' + buf.join("") + "</div>" : buf.join("");
    buf = [];
  };
  for (const k of ks) {
    const p = k.pos || 0;
    if (p > ti) { flush(); out += '<div class="body cont">' + para(txt.slice(ti, p)) + "</div>"; ti = p; }
    buf.push(renderNode(k));
  }
  flush();
  if (ti < txt.length) out += '<div class="body cont">' + para(txt.slice(ti)) + "</div>";
  return out + (tb ? tableHTML(tb) : "");
}

/* 条文は全部つなげて1ページに出す。章・条の切れ目で区切り、
   サイドバーは今どこを読んでいるかをスクロールに追従して示す。 */
function renderAll() {
  const y = Y();
  if (y.html == null) {
    const parts = [];
    for (const ch of y.chapters) {
      parts.push('<h1 class="chap" id="ch-' + esc(ch.id) + '">' +
        (ch.label ? '<span class="num">' + esc(ch.label) + "</span>" : "") +
        "<span>" + esc(ch.title || "") + "</span></h1>");
      const list = WHOLE.has(ch.id) ? [ch] : (y.kids.get(ch.id) || []);
      for (const sec of list) parts.push(sectionHTML(sec, y));
    }
    y.html = parts.join("");
  }
  $("#doc").innerHTML = y.html;
  show("doc");
  observeSections();
}

function sectionHTML(s, y) {
  const head = s.level === "chapter"
    ? '<h2 class="rule">' + esc(s.title || "") + "</h2>"
    : '<h2 class="rule"><span class="num">' + esc(s.id) + "</span><span>" +
      esc(s.title || "") + "</span></h2>";
  return '<section class="sect" data-sec="' + esc(s.id) + '">' + head +
    '<div class="body">' + para(headText(s)) + "</div>" +
    annHTML(s.id) + renderKids(s, false) + "</section>";
}

/* サイドバーの現在位置。画面上端に一番近い条を選ぶ */
let secObserver = null;
function observeSections() {
  if (secObserver) secObserver.disconnect();
  const seen = new Map();
  secObserver = new IntersectionObserver(entries => {
    for (const e of entries) seen.set(e.target.dataset.sec, e);
    let best = null;
    for (const [, e] of seen) {
      if (!e.isIntersecting) continue;
      if (!best || e.boundingClientRect.top < best.boundingClientRect.top) best = e;
    }
    if (best) highlightNav(best.target.dataset.sec);
  }, {root: $("#main"), rootMargin: "-8% 0px -80% 0px", threshold: 0});
  document.querySelectorAll(".sect").forEach(el => secObserver.observe(el));
}

function highlightNav(id) {
  if (S.section === id) return;
  S.section = id;

/* ===== 目次 ===== */
function buildNav() {
  const y = Y();
  const chg = S.changedIn[S.year] || new Set();
  const annSet = new Set(allAnn().flatMap(a => a.target || []));
  let h = "";
  for (const c of y.chapters) {
    h += '<div class="navch">' + esc((c.label ? c.label + "　" : "") + (c.title || "")) + "</div>";
    for (const s of (WHOLE.has(c.id) ? [c] : (y.kids.get(c.id) || []))) {
      let cnt = 0;
      for (const id of chg) if (y.sectionOf.get(id) === s.id) cnt++;
      const hasAnn = [...annSet].some(id => y.sectionOf.get(id) === s.id);
      // 1.00 の各条のように表題を持たない条は、番号だけを出して表題欄は空にする
      const num = s.level === "chapter" ? "" : s.level === "group" ? (s.label || s.id) : s.id;
      h += '<button class="navit" data-sec="' + esc(s.id) + '">' +
        '<span class="n">' + esc(num) + "</span>" +
        '<span class="t">' + esc(s.title || "") + (hasAnn ? " ✎" : "") + "</span>" +
        (cnt ? '<span class="badge b-chg">' + cnt + "</span>" : "") + "</button>";
    }

/* ===== 検索 ===== */
function search(qs) {
  const q = qs.trim();
  if (!q) { renderAll(); return; }
  const y = Y(), lower = q.toLowerCase(), hits = [];
  const direct = y.byId.get(q) || y.byCite.get(q);
  for (const n of y.nodes) {
    const hay = n.id + " " + (n.cite || "") + " " + (n.label || "") + " " + (n.title || "") +
      " " + (n.text || []).join(" ");
    if (hay.toLowerCase().includes(lower)) hits.push(n);
    if (hits.length > 500) break;
  }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  let h = '<div class="cnt">「' + esc(q) + "」 " + hits.length + " 件" +
    (direct ? '　<a class="xref" data-go="' + esc(direct.id) + '">' + esc(direct.cite || direct.id) + " を開く</a>" : "") +
    "</div>";
  for (const n of hits) {
    const src = (n.title ? n.title + "　" : "") + (n.text || []).join(" ");
    const at = src.toLowerCase().indexOf(lower);
    const from = Math.max(0, at - 32);
    const sn = (from ? "…" : "") + src.slice(from, from + 145) + (src.length > from + 145 ? "…" : "");
    h += '<button class="hit" data-go="' + esc(n.id) + '"><div class="bc">' + esc(n.breadcrumb || bc(n)) +
      '</div><div class="sn">' + esc(sn).replace(re, m => "<mark>" + m + "</mark>") + "</div></button>";
  }
  $("#results").innerHTML = h;
  show("results");
}
function bc(n) {
  const p = []; let c = n;
  while (c) {
    p.push(((c.level === "rule" || c.level === "chapter") ? c.id + " " : (c.label ? c.label + " " : "")) + (c.title || ""));
    c = c.parent ? Y().byId.get(c.parent) : null;
  }
  return p.reverse().join(" ＞ ").replace(/\s+/g, " ").trim();
}

/* ===== 差分（左右2カラム比較） ===== */
const ST_JA = {added: "追加", removed: "削除", changed: "変更",
               renamed: "採番替え", renamed_changed: "採番替え＋変更",
               reparented: "係り先変更"};

function flatten(Yc, rootId) {
  const out = [];
  (function rec(id) {
    const n = Yc.byId.get(id);
    if (!n) return;
    out.push(n);
    for (const k of (Yc.kids.get(id) || [])) rec(k.id);
  })(rootId);
  return out;
}

function cellHTML(n, ops, side, idTag) {
  const y = side === "l" ? S.curDiff.from : S.curDiff.to;
  if (!n) return '<div class="cell ' + side + ' empty" data-y="' + y + '"></div>';
  const chip = idTag ? '<span class="idchip">' + esc(idTag) + "</span>" : "";
  const lead = n.level === "note" ? '<span class="kd">' + esc(n.label || "") + "</span>"
    : n.label ? '<span class="lb">' + esc(n.label) + "</span>"
    : (n.level === "rule" || n.level === "chapter") ? '<span class="lb">' + esc(n.id) + "</span>" : "";
  let bodyTxt;
  if (ops) {
    const want = side === "l" ? "delete" : "insert";
    bodyTxt = ops.map(([t, s]) => t === "equal" ? esc(s)
      : t === want ? (want === "delete" ? "<del>" : "<ins>") + esc(s) + (want === "delete" ? "</del>" : "</ins>")
      : "").join("");
  } else {
    bodyTxt = (n.title ? '<span class="tt">' + esc(n.title) + "</span>" + (n.text ? "　" : "") : "") +
      esc((n.text || []).join(" ")) + (n.table ? tableHTML(n.table) : "");
  }
  return '<div class="cell ' + side + '" data-y="' + y + '">' + chip + lead + bodyTxt + "</div>";
}

async function renderDiff() {
  const ys = S.manifest.years.map(x => x.year);
  if (ys.length < 2) { $("#diffview").innerHTML = "<p>比較できる年度が1つしかありません。</p>"; show("diffview"); return; }
  const cur = S.curDiff || {from: ys[ys.length - 2], to: ys[ys.length - 1]};
  S.curDiff = cur;
  $("#diffview").innerHTML = '<p style="color:var(--fg3)">' + cur.from + " と " + cur.to + " を比較中…</p>";
  show("diffview");
  if (S.uni === null) S.uni = isNarrow();
  const d = await computeDiff(cur.from, cur.to);
  const [YA, YB] = [await loadYear(cur.from), await loadYear(cur.to)];

  const byNew = new Map(), byOld = new Map();
  for (const e of d.entries) {
    if (e.status === "removed") byOld.set(e.id, e);            // idは旧年度のもの
    else if (e.status === "added") byNew.set(e.id, e);
    else { byNew.set(e.id, e); byOld.set(e.old_id || e.id, e); }
  }
  const pairAB = new Map(d.pairs), pairBA = new Map(d.pairs.map(([a, b]) => [b, a]));

  const yearOpts = y => S.manifest.years
    .map(x => '<option' + (x.year === y ? " selected" : "") + ">" + x.year + "</option>").join("");
  const n = d.summary;
  let h = '<div id="diffbar">' +
    '<div class="opts">' +
      '<label><input type="checkbox" id="onlychg"' + (S.onlyChanged ? " checked" : "") +
        ">改正箇所のみ表示</label>" +
      '<span class="seg"><button data-uni="0"' + (S.uni ? "" : ' class="on"') + ">並べて</button>" +
      '<button data-uni="1"' + (S.uni ? ' class="on"' : "") + ">インライン</button></span>" +
      '<span class="stat">' +
        '<span class="s-add">追加 <b>' + n.added + "</b></span>" +
        '<span class="s-chg">変更 <b>' + n.changed + "</b></span>" +
        '<span class="s-ren">採番替え <b>' + ((n.renamed || 0) + (n.renamed_changed || 0)) + "</b></span>" +
      '<span class="s-rep">係り先 <b>' + (n.reparented || 0) + "</b></span>" +
        '<span class="s-del">削除 <b>' + n.removed + "</b></span>" +
      "</span></div>" +
    '<div class="yrs' + (S.uni ? " uni" : "") + '"><div><select id="dfrom">' + yearOpts(cur.from) +
    "</select></div>" +
    '<div><select id="dto">' + yearOpts(cur.to) + "</select></div></div></div>";

  // 表示対象の条（改正のみ表示なら、変更のある条だけ）
  const secIds = [];
  for (const s of YB.sections) {
    if (!S.onlyChanged) { secIds.push(s.id); continue; }
    const hit = d.entries.some(e =>
      YB.sectionOf.get(e.id) === s.id || YA.sectionOf.get(e.old_id || e.id) === s.id);
    if (hit) secIds.push(s.id);
  }
  // 旧年にしか無い条も拾う
  for (const s of YA.sections) {
    if (!YB.byId.has(s.id) && !secIds.includes(s.id)) secIds.push(s.id);
  }

  for (const sid of secIds) h += compareSection(sid, YA, YB, d, byNew, byOld, pairAB, pairBA);
  if (!secIds.length) h += "<p>この年度間に改正はありません。</p>";
  $("#diffview").innerHTML = h;
  show("diffview");
  if (S.section) {
    const el = document.getElementById("cmp-" + S.section);
    if (el) el.scrollIntoView({block: "start"});
  }
}

function compareSection(sid, YA, YB, d, byNew, byOld, pairAB, pairBA) {
  const listA = YA.byId.has(sid) ? flatten(YA, sid) : [];
  const listB = YB.byId.has(sid) ? flatten(YB, sid) : [];

  // 新年度の並び順を骨格にし、旧年度にしか無いノードを元の位置へ差し込む。
  // （対応表があるので順序をなぞる必要がなく、ズレない）
  const rows = [], posOfA = new Map();
  for (const b of listB) {
    const aid = pairBA.get(b.id);
    const a = aid ? YA.byId.get(aid) : null;
    rows.push([a, b]);
    if (a) posOfA.set(a.id, rows.length - 1);
  }
  const inserts = new Map();
  let last = -1;
  for (const a of listA) {
    if (pairAB.has(a.id) && posOfA.has(a.id)) { last = posOfA.get(a.id); continue; }
    if (!inserts.has(last)) inserts.set(last, []);
    inserts.get(last).push(a);
  }
  const merged = [];
  for (const a of (inserts.get(-1) || [])) merged.push([a, null]);
  rows.forEach((r, i) => {
    merged.push(r);
    for (const a of (inserts.get(i) || [])) merged.push([a, null]);
  });

  const out = [];
  let changed = 0;
  for (const [a, b] of merged) {
    const e = b ? byNew.get(b.id) : byOld.get(a.id);
    let status = "same";
    if (!a) status = "added";
    else if (!b) status = "removed";
    else if (e) status = e.status === "renamed_changed" ? "changed" : e.status;
    if (status !== "same") changed++;
    if (S.onlyChanged && status === "same") continue;
    const ops = (status === "changed" && e && e.ops) ? e.ops : null;
    const ref = b || a;
    const tag = status === "same" ? "" :
      '<div class="rowtag"><span class="st st-' + status + '">' + ST_JA[status] + "</span>" +
      '<span class="cite-l" data-go="' + esc(ref.id) + '">' + esc((e && e.cite) || ref.cite || ref.id) + "</span>" +
      (e && e.reparent
        ? '<span class="ofc">係り先 ' + esc(e.reparent.from || "—") + " → " + esc(e.reparent.to || "—") + "</span>"
        : "") + "</div>";
    const renamed = !!(e && e.old_id);
    out.push('<div class="row r-' + status + '">' + tag +
      (S.uni
        ? unifiedCell(a, b, ops, status)
        : cellHTML(a, ops, "l", renamed ? a.id : "") +
          cellHTML(b, ops, "r", renamed ? b.id : "")) + "</div>");
  }
  if (!out.length) return "";
  const s = YB.byId.get(sid) || YA.byId.get(sid);
  return '<div class="secttl" id="cmp-' + esc(sid) + '">' +
    (s.level === "chapter" ? "" : '<span class="num">' + esc(sid) + "</span>") +
    "<span>" + esc(s.title || "") + "</span>" +
    (changed ? '<span class="cnt">改正 ' + changed + "</span>" : "") + "</div>" +
    '<div class="cols' + (S.uni ? " uni" : "") + '">' + out.join("") + "</div>";
}

function go(id) {

/* ===== 注釈ダイアログ ===== */
let editing = null;
let dlgTargets = [];      // 注釈の対象。複数の条文にまたがることがある

function chipHTML(id) {
  const n = Y().byId.get(id);
  const label = n ? (n.cite || n.id) : id;
  let title = n ? (n.title || (n.text || []).join("")) : "";
  if (title.length > 14) title = title.slice(0, 14) + "…";
  return '<span class="chip2"><b>' + esc(label) + "</b>" + (title ? esc(title) : "") +
    '<button type="button" data-drop="' + esc(id) + '">✕</button></span>';
}
function renderChips() {
  $("#chips").innerHTML = dlgTargets.map(chipHTML).join("");
}
function addTarget(id) {
  if (!dlgTargets.includes(id)) dlgTargets.push(id);
  renderChips();
  $("#f_pick").value = "";
  $("#picklist").hidden = true;
}
function searchTargets(q) {
  const list = $("#picklist");
  const s = q.trim().toLowerCase();
  if (!s) { list.hidden = true; return; }
  const y = Y();
  const hits = [];
  for (const n of y.nodes) {
    if (dlgTargets.includes(n.id)) continue;
    const hay = (n.id + " " + (n.cite || "") + " " + (n.title || "") + " " +
                 (n.text || []).join(" ")).toLowerCase();
    if (hay.includes(s)) hits.push(n);
    if (hits.length >= 12) break;
  }
  list.innerHTML = hits.length
    ? hits.map(n => '<button type="button" data-pick="' + esc(n.id) + '">' +
        '<span class="id">' + esc(n.cite || n.id) + "</span>" +
        esc((n.title || (n.text || []).join("")).slice(0, 40)) + "</button>").join("")
    : '<button type="button" disabled style="color:var(--fg3)">該当なし</button>';
  list.hidden = false;
}

function openDlg(ex) {

$("#pick").addEventListener("click", e => {

/* ===== イベント ===== */
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go); return; }

$("#diffview").addEventListener("change", e => {

$("#yearsel").addEventListener("change", async e => {

$("#burger").onclick = () => toggleNav();
$("#scrim").onclick = () => toggleNav(false);
let tmr;
$("#q").addEventListener("input", () => {

/* 「/」で検索へ。入力中の欄からは奪わない */
const inField = el => el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
document.addEventListener("keydown", e => {
  if (e.key === "/" && !inField(document.activeElement)) {
    e.preventDefault(); $("#q").focus(); $("#q").select();
  }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; search(""); $("#q").blur(); }
});
/* 既定はOSの設定に従う。ボタンで 自動 → ダーク → ライト と切り替えられる。
   今どれなのかが分からないと困るので、ボタン自身に状態を出す */
const THEME_LABEL = {"": "◐ 自動", dark: "● ダーク", light: "○ ライト"};
function applyTheme(v) {
  if (v) document.documentElement.setAttribute("data-theme", v);
  else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("obr.theme", v);
  const b = $("#btheme");
  if (b) {
    b.textContent = THEME_LABEL[v];
    b.title = v ? "表示: " + THEME_LABEL[v].slice(2) : "表示: OSの設定に従う";
  }
}
$("#btheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || "";
  applyTheme(cur === "" ? "dark" : cur === "dark" ? "light" : "");
};
$("#bexport").onclick = () => {
  const out = {version: 1, updated: new Date().toISOString().slice(0, 10), annotations: allAnn()};
  const b = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "annotations.json"; a.click();
  URL.revokeObjectURL(a.href);
};
$("#bimport").onclick = () => $("#fileinput").click();
$("#fileinput").onchange = () => {
  const f = $("#fileinput").files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const inc = (JSON.parse(r.result).annotations) || [];
      const known = new Set(allAnn().map(a => a.id));
      let k = 0;
      for (const a of inc) if (!known.has(a.id)) { localAnn.push(a); k++; }
      saveLocal(); Y().html = null; buildNav(); renderAll();
      alert(k + " 件を読み込みました。");
    } catch (err) { alert("読み込めませんでした: " + err.message); }
  };
  r.readAsText(f); $("#fileinput").value = "";
};

/* ===== その年に改正のあった条項 ===== */
async function computeChanged() {
  if (S.changedIn[S.year]) return;
  const ys = S.manifest.years.map(x => x.year);
  const i = ys.indexOf(S.year);
  const set = new Set();
  if (i > 0) {
    const d = await computeDiff(ys[i - 1], S.year);
    for (const e of d.entries) if (e.status !== "removed") set.add(e.id);
  }
  S.changedIn[S.year] = set;
}

/* ===== 起動 ===== */
(async function boot() {
  applyTheme(localStorage.getItem("obr.theme") || "");
  try {
    S.manifest = await getJSON("manifest.json");
    try { fileAnn = (await getJSON(S.manifest.annotations)).annotations || []; } catch (e) { fileAnn = []; }
    S.year = S.manifest.latest;
    $("#yearsel").innerHTML = S.manifest.years
      .map(x => '<option' + (x.year === S.year ? " selected" : "") + ">" + x.year + "</option>").join("");
    await loadYear(S.year);
    await computeChanged();
    buildNav();
    $("#msg").hidden = true;
    $("#app").hidden = false;
    const hash = decodeURIComponent(location.hash.slice(1));
    renderAll();
    if (hash && (Y().byId.has(hash) || Y().byCite.has(hash))) go(hash);
  } catch (e) {
    $("#msg").innerHTML = "<div><p><b>データを読み込めませんでした</b></p>" +
      "<p style='color:var(--fg3)'>" + esc(e.message) + "</p>" +
      "<p>このページはデータを外部ファイルから読み込みます。<br>" +
      "ブラウザの制約で <code>file://</code> では動きません。<br><br>" +
      "このフォルダで<br><code>python3 -m http.server 8000</code><br>を実行し、<br>" +
      "<code>http://localhost:8000/</code> を開いてください。</p></div>";
  }
})();
</script>
</body>
</html>
