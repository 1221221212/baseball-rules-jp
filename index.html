<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公認野球規則</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="msg">読み込み中…</div>
<button id="burger" aria-label="目次">☰</button>
<div id="scrim"></div>
<div id="app" hidden>
  <aside id="side">
    <div id="brand">
      <h1>公認野球規則</h1>
      <select id="yearsel" title="年度"></select>
    </div>
    <div id="modes">
      <button data-mode="read" class="on">規則</button>
      <button data-go-com>解説</button>
    </div>
    <div id="searchwrap">
      <input id="q" type="search" placeholder="検索" autocomplete="off" spellcheck="false">
      <button id="qclear" aria-label="クリア">✕</button>
    </div>
    <nav id="nav"></nav>
    <div id="tools">
      <button id="bdiff">⇄ 比較</button>
    </div>
  </aside>
  <main id="main">
    <div id="doc"></div>
    <div id="results" hidden></div>
    <div id="diffview" hidden></div>
  </main>
</div>

<script src="diff.js"></script>
<script src="refs.js"></script>
<script src="app.js"></script>
</body>
</html>
